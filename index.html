<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MO</title>
<style>
:root{--bg:#02060f;--panel:#07152b;--blue:#2fc4ff;--blue2:#0a7bd1;--text:#cfeeff;--dim:#6b8fa8;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;overflow:hidden}
body{background:radial-gradient(ellipse at 50% 35%,#0a2547 0%,var(--bg) 70%)}
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;font-size:12px;letter-spacing:2px;color:var(--blue);border-bottom:1px solid #12385e}
header b{font-size:15px;letter-spacing:4px}
main{flex:1;overflow-y:auto;padding:18px;position:relative}
.view{display:none;animation:fade .4s}.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
.core{position:relative;width:230px;height:230px;margin:18px auto 22px}
.core i{position:absolute;inset:0;border-radius:50%;border:2px solid transparent}
.r1{border-top-color:var(--blue)!important;border-bottom-color:var(--blue)!important;animation:spin 6s linear infinite}
.r2{inset:22px!important;border:2px dashed var(--blue2)!important;animation:spin 14s linear infinite reverse}
.r3{inset:48px!important;border-left-color:var(--blue)!important;border-right-color:var(--blue)!important;animation:spin 4s linear infinite}
.dot{position:absolute;inset:82px;border-radius:50%;background:radial-gradient(circle,#bff0ff,var(--blue) 45%,transparent 72%);box-shadow:0 0 40px var(--blue);animation:pulse 2.4s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(1.18);opacity:.7}}
.greet{text-align:center;font-size:15px;margin-bottom:6px}
.sub{text-align:center;color:var(--dim);font-size:13px;margin-bottom:20px}
.card{background:linear-gradient(160deg,var(--panel),#040c1b);border:1px solid #12385e;border-radius:12px;padding:12px 14px;margin-bottom:10px;display:flex;justify-content:space-between;font-size:13px;box-shadow:0 0 14px #0a7bd122 inset}
.card span:last-child{color:var(--blue)}
.off{color:#e0a34a!important}
h2{font-size:16px;letter-spacing:3px;color:var(--blue);margin-bottom:10px}
.ph{color:var(--dim);font-size:14px;line-height:1.5;border:1px dashed #1b4a78;border-radius:12px;padding:16px}
nav{display:flex;overflow-x:auto;border-top:1px solid #12385e;background:#030b18;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:0 0 auto;background:none;border:0;color:var(--dim);font-size:11px;letter-spacing:1px;padding:10px 12px;border-radius:8px}
nav button.on{color:var(--bg);background:var(--blue);font-weight:700}
#chat.on{position:absolute;inset:0;padding:14px 14px 10px;display:flex;flex-direction:column}
#log{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px 0 8px}
.m{max-width:84%;padding:9px 12px;border-radius:12px;font-size:14px;line-height:1.4;white-space:pre-wrap;word-wrap:break-word}
.m.j{align-self:flex-start;background:var(--panel);border:1px solid #12385e}
.m.u{align-self:flex-end;background:var(--blue2);color:#fff}
.bar{display:flex;gap:8px;align-items:center}
.bar input{flex:1;min-width:0;background:var(--panel);border:1px solid #1b4a78;border-radius:20px;color:var(--text);padding:11px 14px;font-size:16px;outline:none}
.bar button{background:var(--blue);color:var(--bg);border:0;border-radius:20px;padding:11px 16px;font-weight:700;font-size:14px}
.bar button.g{background:none;color:var(--dim);border:1px solid #1b4a78;padding:11px 12px}
.mb{background:none;border:1px solid #1b4a78;color:var(--blue);border-radius:8px;padding:6px 8px;font-size:12px}
.view textarea{width:100%;background:var(--panel);border:1px solid #1b4a78;border-radius:12px;color:var(--text);padding:10px 12px;font-size:16px;outline:none;font-family:inherit}
#wfr{width:100%;height:420px;border:1px solid #1b4a78;border-radius:12px;background:#fff;margin:10px 0}
.core{cursor:pointer}
.core.on .dot{box-shadow:0 0 90px 20px var(--blue);filter:brightness(1.4)}
</style>
</head>
<body>
<div id="app">
<header><b>MO</b><span id="clock">--:--</span></header>
<main>
<section class="view on" id="home">
<div class="core"><i class="r1"></i><i class="r2"></i><i class="r3"></i><div class="dot"></div></div>
<p class="greet">Guten Tag, Sir.</p>
<p class="sub">Tippe auf den Kreis und sprich, Sir.</p>
<textarea id="hin" rows="2" placeholder="Auftrag sagen oder schreiben. Infos kannst du auch einfügen."></textarea>
<div class="bar" style="margin:8px 0 14px"><button id="hgo">Ausführen</button><button class="g" id="hlis">Zuhören: aus</button></div>
<div id="hout" class="ph" style="display:none;margin-bottom:14px;white-space:pre-wrap;color:var(--text)"></div>
<div class="card"><span>System</span><span>online</span></div>
<div class="card"><span>KI-Modell</span><span id="hmod" class="off">Gemini, Schlüssel nötig</span></div>
<div class="card"><span>Gedächtnis</span><span class="off">aktiv, nur auf diesem Gerät</span></div>
<div class="card"><span>Kosten</span><span>0 €</span></div>
</section>
</main>
<nav id="nav"></nav>
</div>
<script>
var views=[["HOME","home"],["CHAT","chat","Phase 2"],["WEB BUILDER","web","Phase 6"],["BUSINESS","biz","Phase 7"],["E-COMMERCE","shop","Phase 7"],["AUTOMATION","auto","Phase 8"],["MEMORY","mem","Phase 4"],["ANALYTICS","ana","Phase 7"],["SETTINGS","set","Phase 9"]];
var nav=document.getElementById("nav"),main=document.querySelector("main");
views.forEach(function(v,i){
  if(i>0){var s=document.createElement("section");s.className="view";s.id=v[1];
    s.innerHTML="<h2>"+v[0]+"</h2><div class=\"ph\">Dieser Bereich ist noch nicht aktiv. Er wird in "+v[2]+" gebaut, Sir.</div>";main.appendChild(s);}
  var b=document.createElement("button");b.textContent=v[0];if(i==0)b.className="on";
  b.onclick=function(){
    document.querySelectorAll(".view").forEach(function(e){e.classList.remove("on")});
    document.getElementById(v[1]).classList.add("on");
    nav.querySelectorAll("button").forEach(function(x){x.classList.remove("on")});b.classList.add("on");main.scrollTop=0;};
  nav.appendChild(b);
});
/* ===== PHASE 2: CHAT ===== */
var KEY="jarvis_chat",hist=[];
try{hist=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){hist=[]}
function saveHist(){try{localStorage.setItem(KEY,JSON.stringify(hist.slice(-50)))}catch(e){}}
/* DAS „GEHIRN“: Phase 3 tauscht nur diese eine Funktion gegen ein echtes KI-Modell aus. */
var MK="jarvis_memory",mem=[];
try{mem=JSON.parse(localStorage.getItem(MK)||"[]")}catch(e){mem=[]}
function saveMem(){try{localStorage.setItem(MK,JSON.stringify(mem))}catch(e){}}
var mv=document.getElementById("mem");
mv.innerHTML="<h2>MEMORY</h2><div class=\"bar\"><input id=\"min\" placeholder=\"Neue Information …\" autocomplete=\"off\"><button id=\"madd\">Merken</button></div><p class=\"sub\" style=\"margin:10px 0\" id=\"mcnt\"></p><div id=\"mlist\"></div>";
function drawMem(){
  var l=document.getElementById("mlist");l.innerHTML="";
  document.getElementById("mcnt").textContent=mem.length?mem.length+" Einträge (nur auf diesem Gerät)":"Noch nichts gespeichert, Sir.";
  mem.forEach(function(m,i){
    var c=document.createElement("div");c.className="card";c.style.alignItems="center";c.style.gap="8px";
    var t=document.createElement("span");t.textContent=m.text;t.style.flex="1";t.style.color="var(--text)";
    var e=document.createElement("button");e.className="mb";e.textContent="Ändern";
    var d=document.createElement("button");d.className="mb";d.textContent="Löschen";
    e.onclick=function(){var n=prompt("Eintrag ändern:",m.text);if(n!==null&&n.trim()){m.text=n.trim();saveMem();drawMem();}};
    d.onclick=function(){if(confirm("Eintrag löschen?")){mem.splice(i,1);saveMem();drawMem();}};
    c.appendChild(t);c.appendChild(e);c.appendChild(d);l.appendChild(c);});
}
function addMem(t){t=t.trim();if(!t)return;mem.push({text:t});saveMem();drawMem();}
document.getElementById("madd").onclick=function(){var i=document.getElementById("min");addMem(i.value);i.value="";};
drawMem();
function cfg(k,d){try{return localStorage.getItem("jarvis_"+k)||d}catch(e){return d}}
function gen(sys,contents,json){
  var key=cfg("key","");
  if(!key)return Promise.reject(new Error("Kein API-Schlüssel hinterlegt. Bitte unter SETTINGS eintragen."));
  var url="https://generativelanguage.googleapis.com/v1beta/models/"+encodeURIComponent(cfg("model","gemini-3.5-flash"))+":generateContent";
  var body={systemInstruction:{parts:[{text:sys}]},contents:contents};
  if(json)body.generationConfig={responseMimeType:"application/json"};
  return fetch(url,{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":key},body:JSON.stringify(body)})
  .then(function(r){return r.json().then(function(j){
    if(!r.ok)throw new Error((j.error&&j.error.message)||("HTTP "+r.status));
    var p=j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts;
    if(!p)throw new Error("Leere Antwort");
    return p.map(function(x){return x.text||""}).join("");});});
}
function brain(messages){
  var c=[];
  messages.slice(-20).forEach(function(m){c.push({role:m.role=="u"?"user":"model",parts:[{text:m.text}]})});
  while(c.length&&c[0].role=="model")c.shift();
  var sys="Du bist MO, ein ruhiger, professioneller persönlicher KI-Assistent. Antworte auf Deutsch, präzise und strukturiert, und sprich den Nutzer mit „Sir“ an. Sei ehrlich über deine Grenzen, verspreche nie garantierte Einnahmen und täusche keine Aktionen vor.";
  if(mem.length)sys+="\n\nGespeicherte Informationen über den Nutzer (nutze sie nur, wenn sie relevant sind):\n- "+mem.map(function(m){return m.text}).join("\n- ");
  return gen(sys,c,false).catch(function(e){return "Verbindung fehlgeschlagen, Sir: "+e.message;});
}
function autoMem(u,r){
  if(cfg("auto","1")!="1")return;
  var sys="Du extrahierst dauerhaft nützliche Fakten über den Nutzer aus einem Gesprächsausschnitt (Ziele, Projekte, Entscheidungen, Präferenzen, Pläne). Antworte NUR mit einem JSON-Array kurzer deutscher Sätze, z. B. [\"Der Nutzer plant ...\"]. Speichere keine Passwörter, Schlüssel, Zahlungsdaten, Ausweisnummern, Gesundheitsdaten oder Geheimnisse. Speichere nichts, was schon in der Liste steht. Wenn nichts Neues: [].";
  var p="Bereits gespeichert:\n"+(mem.map(function(m){return "- "+m.text}).join("\n")||"(nichts)")+"\n\nNutzer: "+u+"\nMO: "+r;
  gen(sys,[{role:"user",parts:[{text:p}]}],true).then(function(t){
    var a=JSON.parse(t);if(!Array.isArray(a))return;
    a.slice(0,3).forEach(function(x){if(typeof x=="string"&&x.trim()&&mem.length<100)mem.push({text:x.trim()});});
    saveMem();drawMem();
  }).catch(function(){});
}
var st=document.getElementById("set");
st.innerHTML="<h2>SETTINGS</h2><div class=\"ph\">KI-Anbieter: Google Gemini (kostenlos)</div><p class=\"sub\" style=\"margin:14px 0 6px\">Modell</p><div class=\"bar\"><input id=\"mdl\"></div><p class=\"sub\" style=\"margin:14px 0 6px\">API-Schlüssel (bleibt nur auf diesem Gerät)</p><div class=\"bar\"><input id=\"kin\" type=\"password\" placeholder=\"AIza...\"></div><p class=\"sub\" style=\"margin:14px 0 6px\"></p><div class=\"bar\"><button id=\"ksv\">Speichern</button><span id=\"kst\" class=\"sub\" style=\"margin:0\"></span></div>";
document.getElementById("mdl").value=cfg("model","gemini-3.5-flash");
document.getElementById("kst").textContent=cfg("key","")?"Schlüssel gespeichert":"Kein Schlüssel";
document.getElementById("ksv").onclick=function(){
  try{localStorage.setItem("jarvis_model",document.getElementById("mdl").value.trim());
  var k=document.getElementById("kin").value.trim();if(k)localStorage.setItem("jarvis_key",k);
  document.getElementById("kin").value="";document.getElementById("kst").textContent="Gespeichert";updHome();}
  catch(e){document.getElementById("kst").textContent="Speichern nicht möglich";}
};
st.insertAdjacentHTML("beforeend","<p class=\"sub\" style=\"margin-top:18px\"><label><input type=\"checkbox\" id=\"aut\"> Auto-Gedächtnis: MO merkt sich Wichtiges selbst</label></p>");
document.getElementById("aut").checked=cfg("auto","1")=="1";
document.getElementById("aut").onchange=function(){try{localStorage.setItem("jarvis_auto",this.checked?"1":"0")}catch(e){}};
var wv=document.getElementById("web"),draft="",cur="",PK="jarvis_projects",projects=[];
try{projects=JSON.parse(localStorage.getItem(PK)||"[]")}catch(e){projects=[]}
function saveProj(){try{localStorage.setItem(PK,JSON.stringify(projects))}catch(e){alert("Speicher voll. Bitte ein Projekt löschen.")}}
wv.innerHTML="<h2>WEB BUILDER</h2><textarea id=\"wd\" rows=\"3\" placeholder=\"z. B. Professionelle Webseite für einen Friseursalon\"></textarea><div class=\"bar\" style=\"margin-top:8px\"><button id=\"wgo\">Entwurf erstellen</button><span id=\"wst\" class=\"sub\" style=\"margin:0\"></span></div><div id=\"wres\" style=\"display:none\"><iframe id=\"wfr\" sandbox=\"allow-scripts\"></iframe><textarea id=\"wch\" rows=\"2\" placeholder=\"Änderungswunsch, z. B. Farben dunkler\"></textarea><div class=\"bar\" style=\"margin:8px 0;flex-wrap:wrap\"><button id=\"wrev\">Überarbeiten</button><button id=\"wok\">Freigeben &amp; speichern</button><button class=\"g\" id=\"wno\">Verwerfen</button></div></div><h2 style=\"margin-top:22px\">PROJEKTE</h2><div id=\"wlist\"></div>";
var WSYS="Du bist ein erfahrener Webdesigner. Erstelle genau EINE vollständige, in sich geschlossene HTML-Datei (HTML, CSS und JavaScript inline), professionell, modern, für Smartphones optimiert (viewport-Meta, responsive), auf Deutsch. Keine externen Dateien, Bilder oder Schriften; nutze CSS-Verläufe, Emojis oder Inline-SVG. Erfinde keine echten Firmendaten, Preise oder Bewertungen, sondern nutze klar erkennbare Platzhalter in eckigen Klammern. Wenn ein Online-Shop oder Dropshipping-Shop gewünscht ist: Produktraster mit Platzhalter-Produkten, Warenkorb per JavaScript, Kasse nur als Platzhalter ohne echte Zahlungsabwicklung. Nutze alle vom Nutzer gelieferten Informationen (Name, Adresse, Öffnungszeiten, Leistungen, Preise) genau so, wie sie angegeben wurden. Antworte NUR mit dem HTML-Code.";
function strip(t){t=t.trim();var m=t.match(/```(?:html)?\s*([\s\S]*?)```/);return m?m[1].trim():t;}
function build(p){
  var s=document.getElementById("wst");s.textContent="MO arbeitet … (bis zu 1 Minute)";
  gen(WSYS,[{role:"user",parts:[{text:p}]}],false).then(function(t){
    cur=strip(t);document.getElementById("wfr").srcdoc=cur;document.getElementById("wres").style.display="block";s.textContent="Entwurf fertig, Sir. Bitte prüfen.";speak("Der Entwurf ist fertig, Sir. Bitte prüfen.");
  }).catch(function(e){s.textContent="Fehler: "+e.message;});
}
function drawProj(){
  var l=document.getElementById("wlist");l.innerHTML=projects.length?"":"<p class=\"sub\">Noch keine Projekte.</p>";
  projects.forEach(function(p,i){
    var c=document.createElement("div");c.className="card";c.style.alignItems="center";c.style.gap="6px";
    var t=document.createElement("span");t.textContent=p.name;t.style.flex="1";t.style.color="var(--text)";
    var o=document.createElement("button");o.className="mb";o.textContent="Öffnen";
    var k=document.createElement("button");k.className="mb";k.textContent="Code";
    var d=document.createElement("button");d.className="mb";d.textContent="Löschen";
    o.onclick=function(){window.open(URL.createObjectURL(new Blob([p.html],{type:"text/html"})),"_blank");};
    k.onclick=function(){navigator.clipboard.writeText(p.html).then(function(){alert("Code kopiert.")}).catch(function(){alert("Kopieren nicht möglich.")});};
    d.onclick=function(){if(confirm("Projekt löschen?")){projects.splice(i,1);saveProj();drawProj();}};
    c.appendChild(t);c.appendChild(o);c.appendChild(k);c.appendChild(d);l.appendChild(c);});
}
document.getElementById("wgo").onclick=function(){var d=document.getElementById("wd").value.trim();if(!d)return;draft=d;build("Erstelle diese Webseite: "+d);};
document.getElementById("wrev").onclick=function(){var c=document.getElementById("wch").value.trim();if(!c||!cur)return;build("Aktuelle Webseite:\n"+cur+"\n\nÄnderungswunsch: "+c+"\nGib die komplette überarbeitete HTML-Datei zurück.");document.getElementById("wch").value="";};
document.getElementById("wok").onclick=function(){if(!cur)return;var n=prompt("Name für das Projekt:",draft.slice(0,40));if(n===null)return;projects.push({name:n.trim()||"Projekt",html:cur});saveProj();drawProj();document.getElementById("wres").style.display="none";cur="";};
document.getElementById("wno").onclick=function(){cur="";document.getElementById("wres").style.display="none";};
drawProj();
var chat=document.getElementById("chat");
chat.innerHTML="<h2>CHAT</h2><div id=\"log\"></div><div class=\"bar\"><button class=\"g\" id=\"clr\">Leeren</button><input id=\"inp\" placeholder=\"Nachricht an MO …\" autocomplete=\"off\"><button class=\"g\" id=\"mic\">🎤</button><button id=\"send\">Senden</button></div>";
var log=document.getElementById("log"),inp=document.getElementById("inp");
function add(role,text){var d=document.createElement("div");d.className="m "+(role=="u"?"u":"j");d.textContent=text;log.appendChild(d);log.scrollTop=log.scrollHeight;}
function draw(){log.innerHTML="";if(!hist.length)add("j","Zu Diensten, Sir. Wie kann ich helfen?");hist.forEach(function(h){add(h.role,h.text)});}
function send(){
  var t=inp.value.trim();if(!t)return;inp.value="";unlockSpeech();
  var mm=t.match(/^merke dir[:,]?\s*(.+)/i);
  if(mm){addMem(mm[1]);hist.push({role:"u",text:t});hist.push({role:"j",text:"Gespeichert, Sir: „"+mm[1].trim()+"“. Du findest es unter MEMORY."});saveHist();draw();return;}
  hist.push({role:"u",text:t});saveHist();draw();add("j","MO denkt …");
  brain(hist).then(function(r){hist.push({role:"j",text:r});saveHist();draw();speak(r);if(r.indexOf("Verbindung fehlgeschlagen")!=0&&r.indexOf("Kein API")!=0)autoMem(t,r);})
  .catch(function(){add("j","Fehler beim Antworten, Sir. Bitte erneut versuchen.");});
}
document.getElementById("send").onclick=send;
inp.onkeydown=function(e){if(e.key=="Enter")send();};
document.getElementById("clr").onclick=function(){hist=[];saveHist();draw();};
draw();
var voiceOn=cfg("voice","1")=="1",rec=null;
function unlockSpeech(){try{if(voiceOn&&window.speechSynthesis){var u=new SpeechSynthesisUtterance(" ");u.volume=0;speechSynthesis.speak(u);}}catch(e){}}
function speak(t){
  try{if(!voiceOn||!window.speechSynthesis)return;
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(t.replace(/[*#`_]/g,""));u.lang="de-DE";
    var v=speechSynthesis.getVoices().filter(function(x){return x.lang&&x.lang.indexOf("de")==0})[0];if(v)u.voice=v;
    speechSynthesis.speak(u);}catch(e){}
}
st.insertAdjacentHTML("beforeend","<p class=\"sub\"><label><input type=\"checkbox\" id=\"vo\"> MO liest Antworten vor</label></p>");
document.getElementById("vo").checked=voiceOn;
document.getElementById("vo").onchange=function(){voiceOn=this.checked;try{localStorage.setItem("jarvis_voice",voiceOn?"1":"0")}catch(e){}if(!voiceOn&&window.speechSynthesis)speechSynthesis.cancel();};
var SR=window.SpeechRecognition||window.webkitSpeechRecognition,micb=document.getElementById("mic");
if(!SR){micb.style.display="none";}
else micb.onclick=function(){
  if(rec){rec.stop();return;}
  rec=new SR();rec.lang="de-DE";rec.interimResults=false;
  micb.textContent="⏹";
  rec.onresult=function(e){inp.value=(inp.value+" "+e.results[0][0].transcript).trim();};
  rec.onend=function(){rec=null;micb.textContent="🎤";};
  rec.onerror=function(){rec=null;micb.textContent="🎤";};
  try{rec.start();}catch(x){rec=null;micb.textContent="🎤";}
};
var bz=document.getElementById("biz");
bz.innerHTML="<h2>BUSINESS</h2><textarea id=\"bi\" rows=\"3\" placeholder=\"Geschäftsidee, z. B. Webseiten für Friseursalons bauen und verkaufen\"></textarea><div class=\"bar\" style=\"margin-top:8px;flex-wrap:wrap\"><button id=\"bgo\">Idee bewerten</button><button class=\"g\" id=\"bmsg\">Kundentext</button><span id=\"bst\" class=\"sub\" style=\"margin:0\"></span></div><div id=\"bout\" class=\"ph\" style=\"display:none;margin-top:12px;white-space:pre-wrap;color:var(--text)\"></div><div class=\"bar\" style=\"margin-top:8px\"><button class=\"g\" id=\"bcp\" style=\"display:none\">Text kopieren</button></div><h2 style=\"margin-top:22px\">RECHNER</h2>";
var F=[["ek","Einkaufs-/Herstellungskosten pro Stück (€)"],["vk","Verkaufspreis (€)"],["vs","Versand pro Stück (€)"],["gb","Zahlungsgebühr (%)"],["wb","Werbung pro Verkauf (€)"],["fx","Fixkosten pro Monat (€)"]];
bz.insertAdjacentHTML("beforeend",F.map(function(f){return "<p class=\"sub\" style=\"margin:10px 0 4px\">"+f[1]+"</p><div class=\"bar\"><input id=\"r_"+f[0]+"\" type=\"text\" inputmode=\"decimal\" placeholder=\"0\"></div>"}).join("")+"<div class=\"bar\" style=\"margin-top:12px\"><button id=\"rgo\">Berechnen</button></div><div id=\"rout\" class=\"ph\" style=\"display:none;margin-top:12px;white-space:pre-wrap;color:var(--text)\"></div>");
function nv(id){var v=parseFloat(document.getElementById("r_"+id).value.replace(",","."));return isNaN(v)?0:v;}
document.getElementById("rgo").onclick=function(){
  var ek=nv("ek"),vk=nv("vk"),vs=nv("vs"),gb=nv("gb"),wb=nv("wb"),fx=nv("fx");
  var g=vk-ek-vs-vk*gb/100-wb,m=vk>0?g/vk*100:0,o=document.getElementById("rout");
  var t="Gewinn pro Verkauf: "+g.toFixed(2)+" €\nMarge: "+m.toFixed(1)+" %\n";
  if(fx>0)t+=g>0?"Break-even: "+Math.ceil(fx/g)+" Verkäufe pro Monat":"Mit diesen Zahlen entsteht kein Gewinn, Sir. Ein Break-even ist nicht erreichbar.";
  t+="\n\nOhne Steuern (z. B. Umsatzsteuer, Einkommensteuer). Das ist keine Steuerberatung.";
  o.textContent=t;o.style.display="block";
};
var BSYS="Du bist ein nüchterner, ehrlicher Geschäftsberater für Einsteiger ohne Startkapital. Bewerte die Geschäftsidee auf Deutsch, kurz und strukturiert, mit diesen Abschnitten: Kurzbewertung (1 bis 10 und warum), Zielgruppe, Chancen, Risiken, Realistische Startkosten, Preisvorschlag, Erste 3 Schritte diese Woche, Rechtliches (nur Hinweise, keine Rechtsberatung, je nach Land prüfen). Verspreche niemals Einnahmen, nenne keine erfundenen Marktzahlen und weise auf Unsicherheit hin. Empfiehl nichts Illegales oder Täuschendes.";
var MSYS="Schreibe eine kurze, freundliche, ehrliche Kontaktnachricht auf Deutsch (E-Mail oder WhatsApp, höchstens 120 Wörter) von dem Nutzer an einen möglichen Kunden. Nutze Platzhalter in eckigen Klammern für Namen und Details. Verspreche keine Ergebnisse und übertreibe nicht.";
function bizRun(sys,prompt,label){
  var s=document.getElementById("bst"),o=document.getElementById("bout");
  s.textContent="MO arbeitet …";
  var ctx=mem.length?"\n\nBekannte Informationen über den Nutzer:\n- "+mem.map(function(m){return m.text}).join("\n- "):"";
  gen(sys+ctx,[{role:"user",parts:[{text:prompt}]}],false).then(function(t){o.textContent=t;o.style.display="block";document.getElementById("bcp").style.display="inline-block";s.textContent=label;speak(label+", Sir.");})
  .catch(function(e){s.textContent="Fehler: "+e.message;});
}
document.getElementById("bgo").onclick=function(){var i=document.getElementById("bi").value.trim();if(i)bizRun(BSYS,"Geschäftsidee: "+i,"Bewertung fertig");};
document.getElementById("bmsg").onclick=function(){var i=document.getElementById("bi").value.trim();if(i)bizRun(MSYS,"Mein Angebot: "+i,"Text fertig");};
document.getElementById("bcp").onclick=function(){navigator.clipboard.writeText(document.getElementById("bout").textContent).then(function(){alert("Kopiert.")}).catch(function(){alert("Kopieren nicht möglich.")});};
var RSYS="Du bist der Auftragsrouter von MO, einem persönlichen Assistenten. Der Nutzer gibt einen Auftrag (gesprochen oder getippt, eventuell mit eingefügten Informationen). Entscheide die Aktion und antworte NUR als JSON: {\"action\":\"website|business|merken|chat\",\"text\":\"...\",\"say\":\"...\"}. website: Der Nutzer will eine Webseite, einen Shop, einen Dropshipping-Shop oder eine Landingpage; text = der vollständige Auftrag inklusive ALLER Informationen, die der Nutzer geliefert hat. business: Geschäftsidee bewerten oder Geschäftsplan; text = die Idee. merken: Der Nutzer will etwas dauerhaft gespeichert haben; text = der Fakt. chat: alles andere; text = die Nachricht unverändert. say: ein kurzer deutscher Satz, mit dem MO den Auftrag bestätigt, Anrede Sir.";
function go(i){nav.querySelectorAll("button")[i].click();}
function run(a,text,say){
  var o=document.getElementById("hout");
  o.textContent=say||"Verstanden, Sir.";
  if(a!="chat")speak(o.textContent);
  if(a=="website"){go(2);document.getElementById("wd").value=text;draft=text.slice(0,40);build("Erstelle diese Webseite beziehungsweise diesen Shop: "+text);}
  else if(a=="business"){go(3);document.getElementById("bi").value=text;bizRun(BSYS,"Geschäftsidee: "+text,"Bewertung fertig");}
  else if(a=="merken"){addMem(text);}
  else{go(1);inp.value=text;send();}
}
function route(cmd){
  cmd=(cmd||"").trim();if(!cmd)return;
  var o=document.getElementById("hout");o.style.display="block";o.textContent="MO versteht den Auftrag …";
  gen(RSYS,[{role:"user",parts:[{text:cmd}]}],true).then(function(t){
    var r;try{r=JSON.parse(t)}catch(x){r={action:"chat",text:cmd}}
    run(r.action,r.text||cmd,r.say);
  }).catch(function(e){o.textContent="Fehler: "+e.message;});
}
var hrec=null,listening=false;
function setCircle(on){document.querySelector(".core").classList.toggle("on",on);}
function startHome(c){
  var o=document.getElementById("hout");
  if(!SR){o.style.display="block";o.textContent="Dieser Browser kann nicht zuhören. Nutze das Mikrofon der iPhone-Tastatur.";listening=false;return;}
  try{hrec=new SR();}catch(e){hrec=null;return;}
  hrec.lang="de-DE";hrec.continuous=c;hrec.interimResults=false;
  hrec.onresult=function(e){
    var t=e.results[e.results.length-1][0].transcript.trim();
    var m=t.match(/^(?:hey|hallo|hi|ok)?\s*mo\b[,.!:]?\s*(.*)$/i);
    if(c){if(!m||!m[1])return;t=m[1];}
    else if(m&&m[1])t=m[1];
    document.getElementById("hin").value=t;route(t);
  };
  hrec.onend=function(){hrec=null;if(listening&&c)setTimeout(function(){startHome(true)},400);else setCircle(false);};
  hrec.onerror=function(ev){if(ev.error!="no-speech"&&ev.error!="aborted"){o.style.display="block";o.textContent="Mikrofon-Problem ("+ev.error+"). Erlaube das Mikrofon für Safari oder diktiere mit der Tastatur.";listening=false;document.getElementById("hlis").textContent="Zuhören: aus";}};
  setCircle(true);
  try{hrec.start();}catch(e){hrec=null;setCircle(false);}
}
document.querySelector(".core").onclick=function(){unlockSpeech();if(hrec){listening=false;document.getElementById("hlis").textContent="Zuhören: aus";hrec.stop();return;}startHome(false);};
document.getElementById("hgo").onclick=function(){unlockSpeech();route(document.getElementById("hin").value);};
document.getElementById("hlis").onclick=function(){
  unlockSpeech();
  if(listening){listening=false;this.textContent="Zuhören: aus";if(hrec)hrec.stop();}
  else{listening=true;this.textContent="Zuhören: an (sag „Hey Mo, …“)";startHome(true);}
};
function updHome(){var e=document.getElementById("hmod"),k=cfg("key","");e.textContent=k?"Gemini, verbunden":"Gemini, Schlüssel nötig";e.className=k?"":"off";}
updHome();
function tick(){var d=new Date();document.getElementById("clock").textContent=d.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});}
tick();setInterval(tick,10000);
</script>
</body>
</html>
